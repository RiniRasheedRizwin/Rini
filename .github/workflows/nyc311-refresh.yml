# Refreshes the NYC 311 dashboard data every Monday (and on demand from the Actions tab).
name: Refresh NYC 311 dashboard

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC (07:17 UAE time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install "pandas>=2.1,<3" numpy requests
      - name: Build dashboard data from NYC Open Data
        run: python nyc311/build_data.py
      - name: Save the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add nyc311/data
          git diff --staged --quiet || (git commit -m "Refresh NYC 311 dashboard data" && git push)
